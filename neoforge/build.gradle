plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'catcraft-companion-neoforge'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
}

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'catcraft_moderation_companion'
        }
    }

    mods {
        catcraft_moderation_companion {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
    compileOnly 'org.lwjgl:lwjgl-glfw:3.3.3'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    inputs.properties(
            version: project.version,
            minecraft_version: project.minecraft_version,
            neo_version: project.neo_version,
            cloth_config_version: project.cloth_config_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                version: project.version,
                minecraft_version: project.minecraft_version,
                neo_version: project.neo_version,
                cloth_config_version: project.cloth_config_version)
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${rootProject.name}" }
    }
}
